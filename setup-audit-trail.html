<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/png" href="icon-32.png">
    <title>View Setup Audit Trail</title>
    <link rel="stylesheet" href="shared.css">
  </head>
  <body>
    <main class="shell schema-shell">
      <div class="card">
        <section class="hero">
          <div class="eyebrow" data-i18n="app.title">Admin Toolkit for Salesforce</div>
          <div id="status" class="status">Waiting for Salesforce session...</div>
        </section>

        <section class="section audit-controls">
          <div class="audit-control-row">
            <div class="field audit-control-field">
              <label for="audit-limit" data-i18n="common.rows">Rows</label>
              <select id="audit-limit">
                <option value="200" data-i18n="common.latest200">Latest 200</option>
                <option value="500" selected data-i18n="common.latest500">Latest 500</option>
                <option value="1000" data-i18n="common.latest1000">Latest 1000</option>
                <option value="2000" data-i18n="common.latest2000">Latest 2000</option>
              </select>
            </div>
            <button type="button" id="clear-audit-filters" class="secondary audit-inline-action" data-i18n="common.clearFilters">Clear Filters</button>
            <div id="audit-active-filters" class="audit-active-filters"></div>
            <p id="audit-operation-status" class="tool-operation-status" aria-live="polite"></p>
          </div>
        </section>

        <section class="section audit-table-section">
          <div id="audit-filter-panel" class="audit-filter-panel" hidden></div>
          <div id="audit-results" class="results audit-results"></div>
        </section>
      </div>
    </main>

    <script type="module" src="tools-nav.js"></script>
    <script type="module" src="setup-audit-trail.js"></script>
  </body>
</html>
